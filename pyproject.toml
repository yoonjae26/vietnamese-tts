[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-tts"
version = "0.1.0"
description = "Vietnamese Text-to-Speech toolkit: text normalization, dataset formatters, training recipes and an OpenAI-compatible API server built on coqui-tts."
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [{ name = "yoonjae26" }]
keywords = ["tts", "text-to-speech", "vietnamese", "coqui", "vits", "speech-synthesis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Vietnamese",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Phần chuẩn hóa văn bản không cần thư viện ngoài
dependencies = []

[project.optional-dependencies]
tts = ["coqui-tts>=0.24.1", "numpy", "soundfile", "librosa"]
server = ["vietnamese-tts[tts]", "fastapi>=0.110", "uvicorn[standard]>=0.29"]
demo = ["vietnamese-tts[tts]", "gradio>=4"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "httpx", "numpy", "soundfile"]

[project.scripts]
vitts-server = "vitts.server:main"

[project.urls]
Homepage = "https://github.com/yoonjae26/vietnamese-tts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG"]
